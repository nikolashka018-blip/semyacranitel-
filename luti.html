<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кислотно-красный сайт</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ff0033; /* Кислотно-красный цвет */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }

        .image-container {
            margin-bottom: 30px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .progress-container {
            width: 100%;
            background-color: #990022;
            border-radius: 25px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid #ffcc00;
        }

        .progress-bar {
            width: 0%;
            height: 40px;
            background: linear-gradient(90deg, #ffcc00, #ff6600);
            border-radius: 25px;
            transition: width 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff0033;
            font-weight: bold;
            font-size: 16px;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #ffcc00;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ЗАГРУЗКА...</h1>
        
        <div class="image-container">
            <!-- Замените ссылку на ваше изображение -->
            <img src="Безымянный.png" alt="Изображение" id="main-image">
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div class="loading-text" id="loadingText">Начинаем загрузку...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            
            let progress = 0;
            
            // Функция для обновления прогресса
            function updateProgress() {
                progress += Math.random() * 10; // Случайное увеличение прогресса
                
                if (progress > 100) {
                    progress = 100;
                }
                
                progressBar.style.width = progress + '%';
                progressBar.textContent = Math.round(progress) + '%';
                
                // Обновляем текст в зависимости от прогресса
                if (progress < 25) {
                    loadingText.textContent = 'Загрузка началась...';
                } else if (progress < 50) {
                    loadingText.textContent = 'Продолжаем загрузку...';
                } else if (progress < 75) {
                    loadingText.textContent = 'Почти готово...';
                } else if (progress < 100) {
                    loadingText.textContent = 'Завершаем...';
                } else {
                    loadingText.textContent = 'Загрузка завершена!';
                    loadingText.style.color = '#ffcc00';
                }
                
                // Продолжаем обновление, пока не достигнем 100%
                if (progress < 100) {
                    setTimeout(updateProgress, 200 + Math.random() * 300); // Случайная задержка
                }
            }
            
            // Запускаем процесс загрузки
            setTimeout(updateProgress, 1000);
        });
    </script>
</body>
</html>
